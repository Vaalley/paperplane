name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: deno install

      - name: Capture lockfile for repository bootstrap
        run: echo "LOCKFILE_BASE64=$(base64 -w0 deno.lock)"

      - name: Validate
        run: deno task validate
